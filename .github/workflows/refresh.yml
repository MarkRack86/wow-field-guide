name: Refresh prices and character

on:
  workflow_dispatch:              # the "Run workflow" button, and each run starting the next one
    inputs:
      chain:
        description: "Started by the previous run: skip the first read if prices were read in the last 40 minutes"
        type: boolean
        default: false
  schedule:
    # A backup that restarts the hourly reads if the chain of runs ever stops. GitHub often starts scheduled runs
    # hours late, or skips them. While a run is going, this one waits in the queue and is replaced by the next run.
    - cron: '25 */3 * * *'
  push:                           # a change to the refresh, or Claude's nudge (config/refresh-request), runs it now
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'refresh.py'
      - 'tools/ci_refresh.py'
      - 'config/refresh-request'

permissions:
  contents: write
  actions: write                  # to start the next run

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # one run reads hourly for about 5 hours, then starts the next (GitHub's limit is 6 hours)
    steps:
      - uses: actions/checkout@v5

      - name: Bring back the previous run's listings (for sell speed)
        uses: actions/cache/restore@v5
        with:
          path: .cache/auctions.json
          key: auctions-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: auctions-

      - name: Refresh prices, character and sell speed at five to every hour
        id: refresh
        env:
          BNET_ID: ${{ secrets.BNET_ID }}
          BNET_SECRET: ${{ secrets.BNET_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/ci_refresh.py --hourly ${{ (github.event_name == 'schedule' || inputs.chain) && '--if-stale' || '' }}

      - name: Keep this run's listings for the next run
        if: always() && steps.refresh.outputs.snapshot == 'new'
        uses: actions/cache/save@v5
        with:
          path: .cache/auctions.json
          key: auctions-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start the next run, which carries on the hourly reads
        if: always() && steps.refresh.outputs.handoff == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true

name: Refresh prices and character

on:
  workflow_dispatch:              # the "Run workflow" button, and cron-job.org at five to each hour in the online hours
  schedule:
    # A backup for cron-job.org: GitHub often starts scheduled runs hours late, or skips them. These hours cover UK
    # winter and summer time; --if-stale stops at once outside about 4.30 to 6.45am and 7.30 to 11.15pm UK time,
    # or when prices were read in the last 40 minutes.
    - cron: '55 3,4,5,18,19,20,21,22 * * *'
  push:                           # a change to the refresh, or a nudge from Claude, runs it straight away
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'refresh.py'
      - 'tools/ci_refresh.py'
      - 'config/refresh-request'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Bring back the previous run's listings (for sell speed)
        uses: actions/cache/restore@v5
        with:
          path: .cache/auctions.json
          key: auctions-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: auctions-

      - name: Refresh prices and character, sell speed and phone alerts
        id: refresh
        env:
          BNET_ID: ${{ secrets.BNET_ID }}
          BNET_SECRET: ${{ secrets.BNET_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/ci_refresh.py ${{ github.event_name == 'schedule' && '--if-stale' || '' }}

      - name: Keep this run's listings for the next run
        if: always() && steps.refresh.outputs.snapshot == 'new'
        uses: actions/cache/save@v5
        with:
          path: .cache/auctions.json
          key: auctions-${{ github.run_id }}-${{ github.run_attempt }}
